# Generator config for dabs-rx. All generated data is synthetic.
# CP1 uses the `reference` section. Simulation settings are added in CP2.

reference:
  # Seeds the fallback unit costs for items with no NADAC price.
  seed: 20261027
  # NADAC dataset year on data.medicaid.gov. The dataset id is looked up by title at fetch time.
  nadac_year: 2026
  fetch_timeout_s: 60
  nadac_batch_size: 200

  # Fallback cost per pricing unit (EA for oral solids, ML for injections), in USD.
  # Used only when no NADAC price exists for the chosen NDC. Rows get cost_source = 'fallback'.
  fallback_cost:
    oral_solid: { pricing_unit: EA, min: 0.10, max: 2.50 }
    injection: { pricing_unit: ML, min: 1.50, max: 12.00 }

  # Curated controlled substance formulary. Each item maps to one NDC chosen from openFDA.
  #   search_name     openFDA generic_name phrase to search on
  #   generic_names   exact generic_name values (lowercase) to accept, filters out combination products
  #   route           openFDA route
  #   dosage_forms    accepted openFDA dosage_form values
  #   strengths       accepted openFDA strength strings, joined with "; " for combination products
  #   form_group      oral_solid or injection, picks the fallback cost range
  #   shortage_names  exact FDA shortage generic_name values that mean this item is short
  formulary:
    - drug_key: morphine_inj_4mg_ml
      display_name: Morphine 4 mg/mL injection
      search_name: morphine sulfate
      generic_names: [morphine sulfate]
      route: INTRAVENOUS
      dosage_forms: [INJECTION, "INJECTION, SOLUTION"]
      strengths: [4 mg/mL]
      form_group: injection
      expected_schedule: CII
      therapeutic_class: opioid
      psych_relevant: false
      shortage_names: [Morphine Sulfate Injection]

    - drug_key: hydromorphone_inj_1mg_ml
      display_name: Hydromorphone 1 mg/mL injection
      search_name: hydromorphone hydrochloride
      generic_names: [hydromorphone hydrochloride]
      route: INTRAVENOUS
      dosage_forms: [INJECTION, "INJECTION, SOLUTION"]
      strengths: [1 mg/mL]
      form_group: injection
      expected_schedule: CII
      therapeutic_class: opioid
      psych_relevant: false
      shortage_names: [Hydromorphone Hydrochloride Injection]

    - drug_key: fentanyl_inj_50mcg_ml
      display_name: Fentanyl 50 mcg/mL injection
      search_name: fentanyl citrate
      generic_names: [fentanyl citrate]
      route: INTRAVENOUS
      dosage_forms: [INJECTION, "INJECTION, SOLUTION"]
      strengths: [50 ug/mL, .05 mg/mL]
      form_group: injection
      expected_schedule: CII
      therapeutic_class: opioid
      psych_relevant: false
