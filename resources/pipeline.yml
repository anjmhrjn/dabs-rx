resources:
  pipelines:
    rx_pipeline:
      name: rx-surveillance-pipeline
      serverless: true
      catalog: ${var.catalog}
      # Default schema for unqualified tables (bronze). Silver and gold use fully qualified names.
      schema: ${resources.schemas.bronze.name}
      # Added to sys.path, so pipeline files can import shared modules such as rules.py.
      root_path: ../src/pipeline
      libraries:
        - glob:
            include: ../src/pipeline/**
      configuration:
        rx.landing_path: ${resources.volumes.landing.volume_path}
        rx.catalog: ${var.catalog}
        rx.bronze_schema: ${resources.schemas.bronze.name}
        rx.silver_schema: ${resources.schemas.silver.name}
        rx.gold_schema: ${resources.schemas.gold.name}
        rx.window_start: ${var.window_start}
        rx.window_end: ${var.window_end}
        rx.waste_delay_minutes: ${var.waste_delay_minutes}
        rx.usage_lookback_days: ${var.usage_lookback_days}
