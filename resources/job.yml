resources:
  jobs:
    rx_job:
      name: rx-surveillance-job
      # Free Edition allows at most 5 concurrent tasks. The 4 tasks run in sequence.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.rx_pipeline.id}

        # Scoring and snapshot never get eval or label parameters (tests/test_label_isolation.py).
        - task_key: score_users
          depends_on: [{ task_key: refresh_pipeline }]
          environment_key: default
          spark_python_task:
            python_file: ../src/scoring/score_users.py
            parameters:
              - --catalog=${var.catalog}
              - --gold-schema=${resources.schemas.gold.name}
              - --features=${var.score_features}
              - --z-cap=${var.z_cap}
              - --min-pulls=${var.min_pulls}
              - --min-wastes=${var.min_wastes}
              - --min-peers=${var.min_peers}
              - --reason-min-z=${var.reason_min_z}
              - --run-id={{job.run_id}}

        - task_key: snapshot_audit
          depends_on: [{ task_key: score_users }]
          environment_key: default
          spark_python_task:
            python_file: ../src/snapshot/snapshot_audit.py
            parameters:
              - --catalog=${var.catalog}
              - --gold-schema=${resources.schemas.gold.name}
              - --audit-fraction=${var.audit_fraction}
              - --run-id={{job.run_id}}

        - task_key: evaluate
          depends_on: [{ task_key: snapshot_audit }]
          environment_key: default
          spark_python_task:
            python_file: ../src/eval/evaluate.py
            parameters:
              - --catalog=${var.catalog}
              - --gold-schema=${resources.schemas.gold.name}
              - --eval-schema=${resources.schemas.eval.name}
              - --labels-path=${resources.volumes.labels.volume_path}
              - --top-k-fractions=${var.top_k_fractions}
              - --run-id={{job.run_id}}
